name: Production deployment

on:
  push:
    branches:
      - main
      - codex/cloudflare-os-production-2026-11-25
      - codex/email-routing-2026-11-26
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deployment is sequential and must never be interrupted by another push.
concurrency:
  group: cloudflare-os-production
  cancel-in-progress: false

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Lint, tests, build and eight-Worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - name: Require the latest pinned Cloudflare OS
        run: |
          pinned=$(git rev-parse HEAD:cloudflare-os)
          latest=$(git ls-remote https://github.com/cloudflare/cloudflare-os.git refs/heads/main | cut -f1)
          test "$pinned" = "$latest" || { echo "Update the cloudflare-os gitlink to upstream main ($latest)."; exit 1; }
          test "$(git -C cloudflare-os rev-parse HEAD)" = "$pinned"
      - name: Install both workspaces from their lockfiles
        run: |
          pnpm --registry=https://registry.npmjs.org install --frozen-lockfile
          pnpm --dir cloudflare-os --registry=https://registry.npmjs.org install --frozen-lockfile
      - name: Verify upstream generated configs and script types
        run: |
          pnpm --dir cloudflare-os configs:check
          pnpm --dir cloudflare-os types:scripts
      - name: Lint and type-check deployment tooling
        run: pnpm lint
      - name: Test, build without cache, and dry-run all eight Workers
        run: pnpm check
      - name: Require a clean checkout after verification
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  deploy:
    name: Deploy and verify production
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: "18503a03d3ee1fd75ac41f76c8d155b4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require the existing deployment credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure repository Actions secret CLOUDFLARE_API_TOKEN using the existing deployment token."; exit 1; }
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - name: Install both workspaces from their lockfiles
        run: |
          pnpm --registry=https://registry.npmjs.org install --frozen-lockfile
          pnpm --dir cloudflare-os --registry=https://registry.npmjs.org install --frozen-lockfile
      - name: Inventory existing deployments, storage and GitHub secret names
        run: node scripts/production-state.ts before
      - name: Require the latest pinned Cloudflare OS before deployment
        run: |
          pinned=$(git rev-parse HEAD:cloudflare-os)
          latest=$(git ls-remote https://github.com/cloudflare/cloudflare-os.git refs/heads/main | cut -f1)
          test "$pinned" = "$latest" || { echo "Upstream advanced to $latest; update the gitlink and rerun CI."; exit 1; }
      - name: Deploy eight Workers, Router last
        run: pnpm deploy
      - name: Verify active versions, bindings and public HTTP routes
        run: node scripts/production-state.ts after
      - name: Preserve deployment inventory even on partial failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deployment-${{ github.sha }}
          path: deployment-records/
          if-no-files-found: ignore
          retention-days: 30
